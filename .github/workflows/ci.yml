name: CI

# Lint, pruebas y escaneo de secretos en cada push y cada PR, sin que alguien
# tenga que acordarse de correrlos a mano. Mati lo dejo pendiente: el token
# con el que subio sus commits de septiembre no tenia el scope 'workflow',
# que GitHub exige para subir o modificar archivos bajo .github/workflows/.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  app:
    name: App · tipos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # El monorepo trae dependencias de React Native con peer deps cruzadas
      # (mismo motivo por el que Vercel usaba --legacy-peer-deps en su
      # installCommand).
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit

  secretos:
    name: Secretos en el historial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El escaneo recorre todo el historial, no solo el commit actual:
          # asi se detecta un secreto en cualquier commit, no solo en HEAD.
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
      # El .env filtrado en mayo de 2026 (commit 2c36c14) se limpio del
      # historial con git filter-repo el 2026-10-15: un clon limpio desde
      # GitHub y este mismo comando, corridos aparte, confirmaron "no leaks
      # found". Ya no hace falta continue-on-error: un hallazgo aca de ahora
      # en adelante es una alarma real.
      - name: Escanear el historial
        run: ./gitleaks git . --config gitleaks.toml --redact --no-banner
